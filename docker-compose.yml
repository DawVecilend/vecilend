networks:
  internal:
    driver: bridge
  proxy:
    external: true

services:
  db:
    build: ./db
    container_name: vecilend_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vecilend_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vecilend_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: vecilend_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.vecilend-api.rule=Host(`vecilend-api.es`)"
      - "traefik.http.routers.vecilend-api.entrypoints=web"
      - "traefik.http.services.vecilend-api.loadbalancer.server.port=8000"
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    container_name: vecilend_scheduler
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - backend_storage:/var/www/html/storage
    command: php artisan schedule:work
    networks:
      - internal
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://vecilend-api.es
    container_name: vecilend_frontend
    restart: unless-stopped
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.vecilend.rule=Host(`vecilend.es`)"
      - "traefik.http.routers.vecilend.entrypoints=web"
      - "traefik.http.services.vecilend.loadbalancer.server.port=3000"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_storage: