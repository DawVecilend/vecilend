services:
  db:
    build: ./db
    container_name: vecilend_db
    restart: always
    environment:
      POSTGRES_DB: vecilend_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    # ⚠️ Sin "ports": la DB solo es accesible desde dentro de Docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vecilend_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: vecilend_backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"   # solo accesible desde el host (Nginx)
    volumes:
      - ./backend/.env:/var/www/html/.env:ro 
      - backend_storage:/var/www/html/storage   # persistir logs de Laravel
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    build: ./backend
    container_name: vecilend_scheduler
    restart: always
    volumes:
      - ./backend/.env:/var/www/html/.env:ro  
      - backend_storage:/var/www/html/storage
    env_file:
      - ./backend/.env
    command: php artisan schedule:work
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: https://vecilend.com
    container_name: vecilend_frontend
    restart: always
    ports:
      - "127.0.0.1:3000:3000"   # solo accesible desde el host (Nginx)
    depends_on:
      - backend

volumes:
  pgdata:
  backend_storage: